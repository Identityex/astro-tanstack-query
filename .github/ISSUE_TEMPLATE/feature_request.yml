name: Feature request
description: Suggest an addition or change
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the package makes hard or impossible?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How you would like it to work. Check the README's out-of-scope list first.
