name: release
on:
  push: { branches: [main] }
permissions:
  contents: write
  pull-requests: write
  # Publishes to GitHub Packages (npm.pkg.github.com) with the workflow's own token.
  packages: write
concurrency: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        # No dependency cache in the publishing job: a poisoned cache would reach the npm tarball.
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: "@identityex"
      - run: npm ci
      # Opens or updates the "Version packages" pull request while changesets are pending, and
      # publishes when that pull request is merged.
      - uses: changesets/action@v2
        with:
          # v2 publishes nothing without publish-script. `release:github` renames the package to
          # its @identityex scope for GitHub Packages, then builds and publishes. It runs only in
          # publish mode, so the rename never lands in the version pull request.
          publish-script: npm run release:github
          version-script: npx changeset version
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read through the .npmrc that setup-node's registry-url writes.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
